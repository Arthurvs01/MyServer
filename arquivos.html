{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Drive</h1>
        <div class="flex space-x-2">
            <button onclick="document.getElementById('modal-upload').classList.remove('hidden')" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">
                <i class="fas fa-upload mr-2"></i>Subir
            </button>
            <button onclick="document.getElementById('modal-folder').classList.remove('hidden')" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300">
                <i class="fas fa-folder-plus mr-2"></i>Nova Pasta
            </button>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="p-3 bg-gray-50 border-b text-sm text-gray-500 font-mono">
            Caminho: /drive/{{ current_path }}
        </div>
        <ul class="divide-y divide-gray-100">
            {% if parent_path is not none %}
            <li class="p-4 hover:bg-gray-50 flex items-center">
                <i class="fas fa-level-up-alt text-gray-400 mr-4"></i>
                <a href="{{ url_for('arquivos', subpath=parent_path) }}" class="text-blue-600 font-medium">.. (Voltar)</a>
            </li>
            {% endif %}

            {% for item in items %}
            <li class="p-4 hover:bg-gray-50 flex items-center justify-between group">
                <div class="flex items-center">
                    <i class="fas {{ 'fa-folder text-yellow-500' if item.is_dir else 'fa-file text-gray-400' }} mr-4 text-xl"></i>
                    <a href="{{ url_for('arquivos', subpath=item.rel_path) }}" class="text-gray-700 hover:text-blue-600 font-medium">
                        {{ item.name }}
                    </a>
                </div>
                <div class="opacity-0 group-hover:opacity-100 transition-opacity">
                    <a href="{{ url_for('delete_item', filepath=item.rel_path) }}" onclick="return confirm('Tem certeza?')" class="text-red-400 hover:text-red-600 p-2">
                        <i class="fas fa-trash-alt"></i>
                    </a>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
</div>

<!-- Modais Simples -->
<div id="modal-upload" class="fixed inset-0 bg-black/50 hidden z-[70] flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm">
        <h3 class="font-bold mb-4">Subir Arquivo</h3>
        <form action="{{ url_for('upload_file') }}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="path" value="{{ current_path }}">
            <input type="file" name="file" class="block w-full text-sm mb-4">
            <div class="flex justify-end space-x-2">
                <button type="button" onclick="this.closest('.fixed').classList.add('hidden')" class="px-4 py-2 text-gray-500">Cancelar</button>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg">Enviar</button>
            </div>
        </form>
    </div>
</div>

<div id="modal-folder" class="fixed inset-0 bg-black/50 hidden z-[70] flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm">
        <h3 class="font-bold mb-4">Nova Pasta</h3>
        <form action="{{ url_for('make_dir') }}" method="post">
            <input type="hidden" name="path" value="{{ current_path }}">
            <input type="text" name="dirname" placeholder="Nome da pasta" class="border rounded-lg p-2 w-full mb-4">
            <div class="flex justify-end space-x-2">
                <button type="button" onclick="this.closest('.fixed').classList.add('hidden')" class="px-4 py-2 text-gray-500">Cancelar</button>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg">Criar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
