{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-yellow-600">Minhas Notas</h1>
        <button onclick="document.getElementById('modal-nota').classList.remove('hidden')" class="bg-yellow-500 text-white p-2 rounded-full shadow-lg">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <div class="grid grid-cols-1 gap-4">
        {% for nota in notas %}
        <div class="bg-yellow-50 p-4 rounded-xl shadow-sm border border-yellow-100 relative cursor-pointer" 
             data-nota='{{ nota|tojson|safe }}'
             onclick='openEditNota(this)'>
            <div class="flex justify-between items-start mb-2">
                <h3 class="font-bold text-yellow-900">{{ nota.titulo }}</h3>
                <a href="{{ url_for('delete_nota', id=nota.id) }}" onclick="event.stopPropagation(); return confirm('Excluir?')" class="text-yellow-700/30 hover:text-red-500"><i class="fas fa-times"></i></a>
            </div>
            <p class="text-sm text-yellow-800 whitespace-pre-wrap line-clamp-6">{{ nota.conteudo }}</p>
            <span class="text-[8px] text-yellow-600/50 mt-3 block uppercase">{{ nota.data_criacao }}</span>
        </div>
        {% endfor %}
    </div>
</div>

<!-- Modal Nota -->
<div id="modal-nota" class="fixed inset-0 bg-black/50 hidden z-[70] flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm">
        <h3 id="nota-modal-title" class="font-bold mb-4">Escrever Nota</h3>
        <form id="nota-form" action="{{ url_for('add_nota') }}" method="post">
            <input type="text" name="titulo" id="nota-titulo" placeholder="Título" class="w-full p-3 bg-gray-100 rounded-xl mb-3 border-none font-bold" required>
            <textarea name="conteudo" id="nota-conteudo" placeholder="Sua nota aqui..." rows="8" class="w-full p-3 bg-gray-100 rounded-xl mb-4 border-none text-sm"></textarea>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeNotaModal()" class="px-4 py-2 text-gray-500">Cancelar</button>
                <button type="submit" class="bg-yellow-500 text-white px-6 py-2 rounded-xl font-bold">Fixar</button>
            </div>
        </form>
    </div>
</div>

<script>
function openEditNota(element) {
    const nota = JSON.parse(element.getAttribute('data-nota'));
    document.getElementById('nota-modal-title').innerText = "Editar Nota";
    document.getElementById('nota-form').action = "/notas/edit/" + nota.id;
    document.getElementById('nota-titulo').value = nota.titulo;
    document.getElementById('nota-conteudo').value = nota.conteudo;
    document.getElementById('modal-nota').classList.remove('hidden');
}
function closeNotaModal() {
    document.getElementById('modal-nota').classList.add('hidden');
    document.getElementById('nota-form').reset();
    document.getElementById('nota-form').action = "{{ url_for('add_nota') }}";
}
</script>
{% endblock %}
