{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-yellow-600">Minhas Notas</h1>
        <button onclick="document.getElementById('modal-nota').classList.remove('hidden')" class="bg-yellow-500 text-white p-2 rounded-full shadow-lg">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <div class="grid grid-cols-1 gap-4">
        {% for nota in notas %}
        <div class="bg-yellow-50 p-4 rounded-xl shadow-sm border border-yellow-100 relative group">
            <div class="flex justify-between items-start mb-2">
                <h3 class="font-bold text-yellow-900">{{ nota.titulo }}</h3>
                <a href="{{ url_for('delete_nota', id=nota.id) }}" class="text-yellow-700/30 hover:text-red-500"><i class="fas fa-times"></i></a>
            </div>
            <p class="text-sm text-yellow-800 whitespace-pre-wrap">{{ nota.conteudo }}</p>
            <span class="text-[9px] text-yellow-600/50 mt-3 block uppercase tracking-tighter">{{ nota.data_criacao }}</span>
        </div>
        {% endfor %}
    </div>
</div>

<!-- Modal Nova Nota -->
<div id="modal-nota" class="fixed inset-0 bg-black/50 hidden z-[70] flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm">
        <h3 class="font-bold mb-4">Escrever Nota</h3>
        <form action="{{ url_for('add_nota') }}" method="post">
            <input type="text" name="titulo" placeholder="Título" class="w-full p-3 bg-gray-100 rounded-xl mb-3 border-none font-bold" required>
            <textarea name="conteudo" placeholder="Sua nota aqui..." rows="5" class="w-full p-3 bg-gray-100 rounded-xl mb-4 border-none text-sm"></textarea>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="this.closest('.fixed').classList.add('hidden')" class="px-4 py-2 text-gray-500">Cancelar</button>
                <button type="submit" class="bg-yellow-500 text-white px-6 py-2 rounded-xl font-bold">Fixar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
