{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">Configurações</h1>

    <!-- Perfil -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-6">
        <h2 class="text-sm font-bold text-gray-400 uppercase mb-4">Preferências</h2>
        <form action="{{ url_for('update_config') }}" method="post" class="space-y-4">
            <div>
                <label class="text-xs text-gray-500 ml-1">Seu Nome</label>
                <input type="text" name="usuario_nome" value="{{ configs.usuario_nome }}" class="w-full p-3 bg-gray-100 rounded-xl border-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">Salvar Alterações</button>
        </form>
    </div>

    <!-- Estatísticas -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <h2 class="text-sm font-bold text-gray-400 uppercase mb-4">Sistema</h2>
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-gray-50 p-4 rounded-xl text-center">
                <div class="text-xl font-bold text-blue-600">{{ stats.arquivos }}</div>
                <div class="text-[10px] text-gray-500 uppercase">Arquivos</div>
            </div>
            <div class="bg-gray-50 p-4 rounded-xl text-center">
                <div class="text-xl font-bold text-yellow-600">{{ stats.notas }}</div>
                <div class="text-[10px] text-gray-500 uppercase">Notas</div>
            </div>
            <div class="bg-gray-50 p-4 rounded-xl text-center col-span-2">
                <div class="text-xl font-bold text-red-600">{{ stats.lembretes }}</div>
                <div class="text-[10px] text-gray-500 uppercase">Total de Lembretes</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
