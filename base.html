<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Hub - {{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { padding-bottom: 70px; } /* Espaço para a barra inferior */
    </style>
</head>
<body class="bg-gray-100 text-gray-900">

    <!-- Conteúdo da Página -->
    <div class="container mx-auto p-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Barra de Navegação Inferior -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-50">
        <div class="flex justify-around items-center h-16">
            <a href="/" class="flex flex-col items-center text-gray-600 hover:text-blue-500 transition">
                <i class="fas fa-home text-xl"></i>
                <span class="text-xs">Home</span>
            </a>
            <a href="/arquivos" class="flex flex-col items-center text-gray-600 hover:text-blue-500 transition">
                <i class="fas fa-folder-open text-xl"></i>
                <span class="text-xs">Arquivos</span>
            </a>
            <a href="/terminal" class="flex flex-col items-center text-gray-600 hover:text-blue-500 transition">
                <i class="fas fa-terminal text-xl"></i>
                <span class="text-xs">Terminal</span>
            </a>
            <button onclick="toggleMenu()" class="flex flex-col items-center text-gray-600 hover:text-blue-500 transition">
                <i class="fas fa-bars text-xl"></i>
                <span class="text-xs">Menu</span>
            </button>
        </div>
    </nav>

    <!-- Menu Modal (Overlay) -->
    <div id="side-menu" class="fixed inset-0 bg-black bg-opacity-50 hidden z-[60]" onclick="toggleMenu()">
        <div class="absolute bottom-16 left-0 right-0 bg-white rounded-t-2xl p-6 shadow-2xl animate-slide-up" onclick="event.stopPropagation()">
            <h2 class="text-lg font-bold mb-4 border-b pb-2">Minhas Ferramentas</h2>
            <div class="grid grid-cols-4 gap-4 text-center">
                <a href="/agenda" class="flex flex-col items-center p-2 hover:bg-gray-100 rounded">
                    <i class="fas fa-calendar-alt text-red-500 mb-1"></i>
                    <span class="text-xs">Agenda</span>
                </a>
                <a href="/notas" class="flex flex-col items-center p-2 hover:bg-gray-100 rounded">
                    <i class="fas fa-sticky-note text-yellow-500 mb-1"></i>
                    <span class="text-xs">Notas</span>
                </a>
                <a href="/configuracoes" class="flex flex-col items-center p-2 hover:bg-gray-100 rounded">
                    <i class="fas fa-cog text-gray-500 mb-1"></i>
                    <span class="text-xs">Config</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('hidden');
        }
    </script>
</body>
</html>
